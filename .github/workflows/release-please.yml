name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Update the release PR, or tag and release a merged one
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

      # A release created with GITHUB_TOKEN does not trigger other workflows,
      # so dispatch the publish workflow on the new tag directly.
      - name: Publish the new release to npm
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
