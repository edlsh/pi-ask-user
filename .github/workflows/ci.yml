name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }}, Pi ${{ matrix.pi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
        pi: ["0.74.0", "0.87.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install pinned development dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Select minimum supported host
        if: matrix.pi == '0.74.0'
        run: bun add --dev --exact --ignore-scripts @earendil-works/pi-coding-agent@0.74.0 @earendil-works/pi-tui@0.74.0

      - name: Verify tests, types, real host, and package
        run: bun run check
